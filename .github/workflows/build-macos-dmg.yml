name: Build unsigned macOS DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/ugreen-app/package-lock.json

      - name: Set version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi

      - name: Build unsigned DMG
        run: |
          set -euo pipefail
          VERSION="$APP_VERSION" \
            BUILD_VERSION="$GITHUB_RUN_NUMBER" \
            SIGN_AND_NOTARIZE=0 \
            CREATE_DMG=1 \
            bash ./scripts/build-macos-app.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NasNotify-Go-macOS-unsigned-dmg
          path: dist/NasNotify-Go-macOS-*.dmg
