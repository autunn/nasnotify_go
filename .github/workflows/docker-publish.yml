name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, for example v2026.06.02-14. Leave empty to use date-run number."
        required: false
        type: string

# Keep JavaScript actions on the current runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            APP_VERSION="$INPUT_VERSION"
          else
            APP_VERSION="v$(date +'%Y.%m.%d')-${GITHUB_RUN_NUMBER}"
          fi
          if [[ ! "$APP_VERSION" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
            echo "Invalid Docker tag: $APP_VERSION" >&2
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/nasnotify-go:latest
            ghcr.io/${{ github.repository_owner }}/nasnotify-go:${{ env.APP_VERSION }}
